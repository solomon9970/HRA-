const t=()=>L[lang];const fName=(key)=>t().factorNames[keys.indexOf(key)];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localRows(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}
function savedMine(){try{return JSON.parse(localStorage.getItem(MINE)||'null')}catch{return null}}
function mean(arr){const v=arr.filter(n=>typeof n==='number'&&Number.isFinite(n));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function individual(r,k){return mean(r.scores[k])}
function typeIndex(r){const vs=keys.slice(0,4).map(k=>individual(r,k)),max=Math.max(...vs);return vs.filter(v=>Math.abs(v-max)<.00001).length>1?4:vs.indexOf(max)}
function fmt(v){return v==null?'—':Number(v).toFixed(2)}
function bucket(rows){if(!rows.length)return {n:0,means:{},types:[0,0,0,0,0]};return {n:rows.length,means:Object.fromEntries(keys.map(k=>[k,mean(rows.map(r=>individual(r,k)))])),types:[0,1,2,3,4].map(n=>rows.filter(r=>typeIndex(r)===n).length)}}
function localStats(){const rows=localRows();const daily={};rows.forEach(r=>{const day=String(r.createdAt||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(day))daily[day]=(daily[day]||0)+1});return {overall:bucket(rows),grade:Object.fromEntries(grades.map(g=>[g,bucket(rows.filter(r=>r.grade===g))])),budget:Object.fromEntries(budgets.map(b=>[b,bucket(rows.filter(r=>r.budget===b))])),satisfaction_likert:[1,2,3,4,5].map(n=>rows.filter(r=>r.scores?.satisfaction?.[0]===n).length),daily:Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0])).map(([day,n])=>({day,n}))}}
function eligible(g){return g&&g.n>=3}
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function navigate(p){stopPoll();destroyCharts();page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function switchLang(next){if(!L[next])return;if(page==='survey'&&step>0)saveAnswers();lang=next;document.documentElement.lang=next==='zh'?'zh-CN':next;destroyCharts();render()}
function shell(content){APP.innerHTML=content}

function home(){const count=stats?.overall?.n??localRows().length;shell(`<section class="hero"><div class="eyebrow">DISCOVER YOUR CONSUMPTION VALUES</div><h1>${t().headline}</h1><p>${t().intro}</p><div class="chips"><span class="chip">${t().duration}</span><span class="chip">${t().anonymous}</span><span class="chip">${t().personal}</span></div><div class="home-lang">${langPicker()}</div><button class="primary" id="start">${t().start}</button></section><div class="grid"><div class="panel"><div class="muted">${t().responses}</div><h2>${count}</h2><p class="small muted">${CONNECTED?t().descStats:t().demo}</p></div><div class="panel"><h2>${t().typeTitle}</h2><p class="muted">${t().intro}</p><button class="secondary" id="results">${t().results}</button></div></div>${footer()}`);bindLanguages();document.getElementById('start').onclick=()=>{step=0;navigate('survey')};document.getElementById('results').onclick=()=>navigate('research');}
function survey(){if(step===0)return basic();const factorKeys=step===1?keys.slice(0,4):['satisfaction'],startNo=step===1?1:13;let q=startNo;const sections=factorKeys.map(k=>`<div class="panel"><h3>${fName(k)}</h3>${question[lang][k].map((v,j)=>{const name=k+'_'+j,id=name;return `<div class="question" data-key="${id}"><label class="qtitle">Q${q++}. ${esc(v)}</label><div class="scale">${t().labels.map((label,i)=>`<div class="choice"><input type="radio" name="${id}" id="${id}_${i}" value="${i+1}" ${answers[id]===i+1?'checked':''}><label for="${id}_${i}"><span class="circle">${i+1}</span><span class="choice-text">${label}</span></label></div>`).join('')}</div></div>`}).join('')}</div>`).join('');shell(`${langPicker()}<div class="row"><h2>${step===1?t().part1:t().part2}</h2><span class="chip">${step+1} / 3 ${t().step}</span></div><div class="progress"><div style="width:${(step+1)*33.33}%"></div></div><p class="muted">${step===1?t().part1Desc:t().part2Desc}</p>${sections}<div class="actions"><button class="ghost" id="prev">${t().prev}</button><div><p id="complete" class="completion-note" role="status" aria-live="polite"></p><button class="primary" id="next" disabled>${step===2?t().submit:t().next}</button></div></div>`);bindLanguages();const all=factorKeys.flatMap(k=>[0,1,2].map(i=>k+'_'+i));function validate(){const done=all.filter(id=>answers[id]!=null).length;const n=all.length-done;document.getElementById('next').disabled=n!==0;document.getElementById('complete').textContent=n?t().remain(n):'✓ '+t().done;all.forEach(id=>{const e=document.querySelector(`[data-key="${id}"]`);e.classList.toggle('answered',answers[id]!=null);e.classList.toggle('pending',answers[id]==null);const q=e.querySelector('.qtitle');let sp=q.querySelector('.state');if(!sp){sp=document.createElement('span');sp.className='state';sp.style.cssText='font-size:12px;font-weight:500;color:#88939e;margin-left:8px';q.appendChild(sp)}sp.textContent=answers[id]!=null?'✓ '+t().answered:'· '+t().missing})}document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{saveAnswers();validate()});validate();document.getElementById('prev').onclick=()=>{step--;survey()};document.getElementById('next').onclick=()=>{saveAnswers();if(all.some(k=>answers[k]==null))return alert(t().needAnswers);if(step===1){step=2;survey()}else submit()}}

function basic(){shell(`${langPicker()}<div class="row"><h2>${t().basic}</h2><span class="chip">1 / 3 ${t().step}</span></div><div class="progress"><div style="width:33%"></div></div><div class="panel"><p class="muted">${t().instruct}</p><div class="field"><label for="grade"><strong>${t().grade}</strong></label><select id="grade"><option value="">${t().choose}</option>${grades.map((v,i)=>`<option value="${v}" ${answers.grade===v?'selected':''}>${t().g[i]}</option>`).join('')}</select></div><div class="field"><label for="budget"><strong>${t().budget}</strong></label><select id="budget"><option value="">${t().choose}</option>${budgets.map((v,i)=>`<option value="${v}" ${answers.budget===v?'selected':''}>${t().b[i]}</option>`).join('')}</select></div><p id="complete" class="completion-note"></p><button class="primary" id="next" disabled>${t().next}</button></div>`);bindLanguages();const update=()=>{answers.grade=document.getElementById('grade').value;answers.budget=document.getElementById('budget').value;let n=Number(!answers.grade)+Number(!answers.budget);document.getElementById('next').disabled=!!n;document.getElementById('complete').textContent=n?t().remain(n):'✓ '+t().done};document.querySelectorAll('select').forEach(e=>e.onchange=update);update();document.getElementById('next').onclick=()=>{if(!answers.grade||!answers.budget)return;step=1;survey()}}
function validatePayload(r){return grades.includes(r.grade)&&budgets.includes(r.budget)&&keys.every(k=>Array.isArray(r.scores[k])&&r.scores[k].length===3&&r.scores[k].every(v=>Number.isInteger(v)&&v>=1&&v<=5))}
function uniqueId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.floor(Math.random()*999999)}
async function request(path,opts={}){const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{...opts,headers:{'apikey':SUPABASE_ANON_KEY,...(SUPABASE_ANON_KEY.startsWith('sb_publishable_')?{}:{'Authorization':'Bearer '+SUPABASE_ANON_KEY}),'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error('Supabase '+r.status+' '+(await r.text()).slice(0,250));const raw=await r.text();return raw?JSON.parse(raw):null}
async function submit(){const r={id:uniqueId(),grade:answers.grade,budget:answers.budget,scores:{},createdAt:new Date().toISOString()};for(const k of keys)r.scores[k]=[0,1,2].map(j=>answers[k+'_'+j]);if(!validatePayload(r))return alert(t().needAnswers);const btn=document.getElementById('next');btn.disabled=true;btn.textContent=t().saving;try{if(CONNECTED){await request('responses',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({grade:r.grade,budget:r.budget,scores:r.scores})})}else{const all=localRows();all.push(r);localStorage.setItem(STORE,JSON.stringify(all))}localStorage.setItem(MINE,JSON.stringify(r));mine=r;answers={};await loadStats(true);navigate('personal')}catch(e){console.error(e);btn.disabled=false;btn.textContent=t().submit;alert(t().submitError)}}
async function loadStats(force=false){
 if(CONNECTED){
  stats=await request('rpc/valueon_stats',{method:'POST',body:'{}'});
  try{research=await request('rpc/valueon_research_stats',{method:'POST',body:'{}'})}
  catch(err){console.warn('Research extension not installed yet:',err);research=null}
  try{contrasts=await request('rpc/valueon_hypothesis_stats',{method:'POST',body:'{}'})}
  catch(err){console.warn('Hypothesis SQL extension not installed yet:',err);contrasts=null}
 }else{stats=localStats();research=localResearch(localRows());contrasts=localContrasts(localRows())}

}
function pearson(rows,x,y){
 const n=rows.length;if(n<10)return null;
 const ax=rows.map(r=>individual(r,x)),ay=rows.map(r=>individual(r,y));
 const mx=ax.reduce((a,b)=>a+b,0)/n,my=ay.reduce((a,b)=>a+b,0)/n;
 let cross=0,xx=0,yy=0;for(let i=0;i<n;i++){let dx=ax[i]-mx,dy=ay[i]-my;cross+=dx*dy;xx+=dx*dx;yy+=dy*dy}
 return xx>0&&yy>0?cross/Math.sqrt(xx*yy):null
}
function localResearch(rows){
 const correlations={};keys.slice(0,4).forEach(k=>correlations[k]=pearson(rows,k,'satisfaction'));
 const grouped={};for(let k=0;k<5;k++){const r=rows.filter(v=>typeIndex(v)===k);grouped[k]={n:r.length,mean:r.length>=3?r.reduce((s,v)=>s+individual(v,'satisfaction'),0)/r.length:null}}
 const bins=new Array(8).fill(0);if(rows.length>=3)rows.forEach(r=>bins[Math.min(7,Math.floor((individual(r,'satisfaction')-1)*2+1e-9))]++);
 return {n:rows.length,correlations,type_satisfaction:grouped,satisfaction_histogram:rows.length>=3?bins:[]}
}

function localContrasts(rows){
 const n=rows.length;
 const grp=(items,key)=>({n:items.length,mean:items.length>=3?items.reduce((a,r)=>a+individual(r,key),0)/items.length:null});
 const expGroups=[[1,2.5],[2.5,3.5],[3.5,5.01]];
 const points=expGroups.map(([lo,hi])=>{
  const items=rows.filter(r=>individual(r,'experience')>=lo&&individual(r,'experience')<hi);
  return {n:items.length,x:items.length>=3?items.reduce((a,r)=>a+individual(r,'experience'),0)/items.length:null,y:items.length>=3?items.reduce((a,r)=>a+individual(r,'satisfaction'),0)/items.length:null}
 }).filter(v=>v.n>=3);
 return {n,h1:{r:pearson(rows,'experience','satisfaction'),points},
 h2:{low:grp(rows.filter(r=>['b1','b2'].includes(r.budget)),'price'),high:grp(rows.filter(r=>['b3','b4'].includes(r.budget)),'price')},
 h3:{low:grp(rows.filter(r=>['g1','g2'].includes(r.grade)),'experience'),high:grp(rows.filter(r=>['g3','g4'].includes(r.grade)),'experience')},
 h4:{low:grp(rows.filter(r=>individual(r,'brand')<4),'satisfaction'),high:grp(rows.filter(r=>individual(r,'brand')>=4),'satisfaction')}}
}

function saveCard(r){const c=document.createElement('canvas');c.width=1000;c.height=1200;const ctx=c.getContext('2d');ctx.fillStyle='#f7f7f5';ctx.fillRect(0,0,1000,1200);ctx.fillStyle='#fff';ctx.fillRect(55,55,890,1090);ctx.fillStyle='#3568a6';ctx.fillRect(55,55,890,18);let y=0;function text(str,x,ty,size=30,col='#293341',weight=500){ctx.fillStyle=col;ctx.font=`${weight} ${size}px system-ui, "Apple SD Gothic Neo", sans-serif`;ctx.fillText(str,x,ty)}text('VALUE:ON',110,165,45,'#3568a6',800);text('HR Analytics · PERSONAL INSIGHT',110,219,20,'#89939e',500);text(summary(r)+' '+t().consumption,110,345,47,'#243347',800);text(t().typeTitle,110,280,24,'#8792a0');keys.slice(0,4).forEach((k,i)=>{y=480+i*135;text(fName(k),110,y,27);ctx.fillStyle='#e8ecf0';ctx.fillRect(110,y+30,660,20);ctx.fillStyle='#3568a6';ctx.fillRect(110,y+30,660*individual(r,k)/5,20);text(fmt(individual(r,k)),800,y+48,27,'#3568a6',750)});ctx.fillStyle='#edf3fa';ctx.fillRect(110,1000,780,80);text(`${t().satis}  ${fmt(individual(r,'satisfaction'))} / 5`,140,1052,29,'#3568a6',750);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='VALUE_ON_result.png';document.body.appendChild(a);a.click();a.remove();document.getElementById('saved-status').textContent=t().saved}

function opt({horizontal=false,max=5,pct=false,showLegend=true}={}){const axis=horizontal?'x':'y';return {responsive:true,maintainAspectRatio:false,indexAxis:horizontal?'y':'x',plugins:{legend:{display:showLegend,position:'bottom',labels:{boxWidth:10,usePointStyle:true,font:{size:11}}},tooltip:{callbacks:{label:c=>`${c.dataset.label?c.dataset.label+': ':''}${Number(c.parsed[axis]).toFixed(pct?1:2)}${pct?'%':''}`}}},scales:{[axis]:{beginAtZero:true,min:0,max:max,ticks:{callback:v=>pct?v+'%':v}},[horizontal?'y':'x']:{grid:{display:false}}}}}
